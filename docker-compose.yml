services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
      POSTGRES_DB: infra_explorer
    ports:
      # Host port is overridable (POSTGRES_HOST_PORT) to avoid clashing with a
      # local Postgres install already bound to 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra_explorer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
